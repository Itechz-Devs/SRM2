services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: SRM
      POSTGRES_USER: SRM
      POSTGRES_PASSWORD: SRM
    ports:
      - "5432:5432"
    volumes:
      - SRM_pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://SRM:SRM@postgres:5432/SRM
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  SRM_pgdata: